<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta author="Luis Saucedo" />
  <title>Ruleta de Entradas · Chuflay</title>
  <!-- SEO básico -->
<title>Chuflay · Ruleta de Entradas</title>
<meta name="description" content="Ruleta de entradas para elegir al integrante al azar y abrir su QR de pago." />
<meta name="theme-color" content="#efe7dc" />

<!-- Open Graph: Facebook, WhatsApp, Messenger -->
<meta property="og:type" content="website" />
<meta property="og:site_name" content="Chuflay" />
<meta property="og:title" content="Chuflay · Ruleta de Entradas" />
<meta property="og:description" content="Escanea y gira la ruleta para elegir al integrante que recibirá tu entrada." />
<meta property="og:url" content="https://luis1828.github.io/chuflay-ruleta-github-pages/" />
<meta property="og:image" content="https://luis1828.github.io/chuflay-ruleta-github-pages/preview.jpg" />
<meta property="og:image:secure_url" content="https://luis1828.github.io/chuflay-ruleta-github-pages/preview.jpg" />
<meta property="og:image:type" content="image/jpeg" />
<meta property="og:image:width" content="911" />
<meta property="og:image:height" content="767" />

<!-- Twitter / X -->
<meta name="twitter:card" content="summary_large_image" />
<meta name="twitter:title" content="Chuflay · Ruleta de Entradas" />
<meta name="twitter:description" content="Escanea y gira la ruleta para elegir al integrante que recibirá tu entrada." />
<meta name="twitter:image" content="https://luis1828.github.io/chuflay-ruleta-github-pages/preview.jpg" />

<!-- Extra compatibilidad -->
<link rel="image_src" href="https://luis1828.github.io/chuflay-ruleta-github-pages/preview.jpg" />
<link rel="canonical" href="https://luis1828.github.io/chuflay-ruleta-github-pages/" />
  <meta name="description" content="Ruleta aleatoria para distribuir compras de entradas entre integrantes." />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <main class="app">
    <section class="hero">
      <p class="eyebrow">CHUFLAY · NO FUE MÁS</p>
      <h1>Ruleta de entradas</h1>
      <p class="subtitle">
        Cada giro elige un integrante al azar con la misma probabilidad.
      </p>
    </section>

    <section class="card">
      <div class="wheel-wrap" aria-label="Ruleta">

        <div class="wheel" id="wheel">
          <div class="wheel-center">
            <span>GIRA</span>
          </div>
        </div>
      </div>

      <div class="controls">
        <button id="spinBtn" class="spin-btn">Girar ruleta</button>
        <p id="status" class="status">Toca el botón para elegir un QR.</p>
      </div>

      <div id="result" class="result hidden" aria-live="polite">
        <div class="result-head">
          <p class="result-label">Elegido</p>
          <h2 id="winnerName">—</h2>
        </div>

        <div class="qr-card">
          <img id="winnerQr" alt="QR del integrante elegido" />
        </div>

        <div class="result-actions">
          <a id="openLink" class="secondary-btn hidden" href="#" target="_blank" rel="noreferrer">Abrir enlace</a>
          <button id="copyName" class="ghost-btn" type="button">Copiar nombre</button>
        </div>
      </div>
    </section>

    <section class="legend">
      <div class="legend-item"><span class="dot dot-a"></span> Ferru</div>
      <div class="legend-item"><span class="dot dot-b"></span> Pollo</div>
      <div class="legend-item"><span class="dot dot-c"></span> Piki</div>
      <div class="legend-item"><span class="dot dot-d"></span> Sam</div>
      <div class="legend-item"><span class="dot dot-e"></span> Koca</div>
    </section>

    <p class="footnote">
      © 2026 Chuflay. Todos los derechos reservados.
    </p>
  </main>

  <script src="./app.js"></script>
</body>
</html>
